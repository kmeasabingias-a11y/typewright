[project]
name = "typewright"
version = "0.1.0"
description = "AI-powered property-based test generator for Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "litellm>=1.88.1",
    "instructor>=1.15.1",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.13.0",
    "arq>=0.28.0",
    "redis>=5",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typewright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
